{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NRC Onboarding</title>
    <link rel="stylesheet" href="{% static 'css/estiloLoguin.css' %}?v=5">
</head>
<body>
  
    <div class="login-wrapper">
        <div class="login-card">
            <h2>NRC Onboarding</h2>
            <p class="login-subtitle">Ingresa a tu cuenta</p>
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" name="username" id="username" placeholder="Tu usuario">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" name="password" id="password" placeholder="Tu contraseña">
                </div>
                <button type="submit" class="btn-login">Ingresar</button>
            </form>
            <p class="register-text">¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate aquí</a></p>
        </div>
    </div>
</body>
</html>
