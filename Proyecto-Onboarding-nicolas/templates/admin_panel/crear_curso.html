{% extends 'admin_panel/base_panel.html' %}

{% block title %}Crear Curso{% endblock %}

{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Añadir Nuevo Curso a un Módulo</h1>
        <a href="{% url 'panel_contenido' %}" class="btn btn-secondary">← Volver a lista</a>
    </div>

    <form method="post" class="form-card" style="max-width: 600px;">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="{{ form.nombreCurso.id_for_label }}">{{ form.nombreCurso.label }}</label>
            {{ form.nombreCurso }}
            {{ form.nombreCurso.errors }}
        </div>
        
        <div class="form-group">
            <label for="{{ form.moduloCurso.id_for_label }}">{{ form.moduloCurso.label }}</label>
            {{ form.moduloCurso }}
            {{ form.moduloCurso.errors }}
        </div>
        
        <div class="mt-4 pt-3" style="border-top: 1px solid var(--border-color);">
            <button type="submit" class="btn btn-primary">Guardar Curso</button>
        </div>
    </form>
{% endblock %}
